name: fogpanther
version: '0.8.2'
title: Fog Panther
summary: Professional raster graphics editor for digital artists and photographers
description: |
  Fog Panther is a professional image editor for people who take their craft
  seriously. Whether you are painting digital art, retouching photographs,
  designing graphics, or preparing artwork for print, it puts real,
  professional-grade power in a fast, focused application that stays out of your
  way.

  Create without limits. Non-destructive layers keep your options open, precise
  selection and masking give you control over every detail, and a deep toolkit
  of brushes, filters, and adjustments is always within reach. Built to stay
  responsive on large, demanding images, Fog Panther helps you do your best work
  — and do it faster.
license: proprietary
icon: snap/gui/icon.png
contact: https://www.fogpanther.com/support
website: https://www.fogpanther.com
issues: https://www.fogpanther.com/support

# core24 (Ubuntu 24.04) matches the ubuntu:24.04 image the snap tarball is built
# in (packaging/build-snap-tarball.sh): glibc 2.39 covers the binary's GLIBC_2.38
# requirement, and the gnome extension resolves to gnome-46-2404, providing the
# GTK 4.14 the app needs (meson.build requires gtk4 >= 4.10). core22 supplied
# glibc 2.35 and, via gnome-42-2204, GTK 4.6 -- both below what the binary needs.
base: core24
confinement: strict
grade: stable

# core24 replaced core22's `architectures` list with `platforms`; an empty
# entry builds natively for that architecture. 0.8.1's move to core24 kept
# the old key, and the Store rejected every build ("'architectures' key is
# not supported for base 'core24'"), so 0.8.1 never reached Snap users.
platforms:
  amd64:
  arm64:

apps:
  fogpanther:
    extensions: [gnome]
    command: bin/fogpanther
    desktop: share/applications/com.fogpanther.FogPanther.desktop
    common-id: com.fogpanther.FogPanther
    plugs:
      - home
      - removable-media
      - cups
      - network    # Was for the trial server (removed; licenses verify offline). Kept until
                   # nothing else is confirmed to need it -- dropping a plug is a store change.

parts:
  fogpanther:
    source: .
    plugin: dump
    build-packages:
      - curl
    override-pull: |
      # Select architecture-specific tarball
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)   ARCH="x86_64" ;;
        arm64)   ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      # Update version and revision here when releasing
      URL="https://www.fogpanther.com/releases/fogpanther-0.8.2-1-snap-${ARCH}.tar.xz"
      curl -fSL "$URL" -o source.tar.xz
      tar xf source.tar.xz --strip-components=1
      rm source.tar.xz
